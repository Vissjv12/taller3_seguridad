# Taller 3 - ClamAV (OPCIONAL, perfil "antivirus")
# Escucha solo dentro de la red del laboratorio; lo consulta Rspamd.
TCPSocket 3310
TCPAddr 0.0.0.0
Foreground true
# Sin LogFile: clamd no acepta /dev/stdout. Las detecciones se ven en el log de Rspamd.
LogVerbose false
DatabaseDirectory /var/lib/clamav
User clamav

# Límites para que un adjunto malicioso no agote recursos
MaxThreads 4
MaxFileSize 25M
MaxScanSize 50M
MaxRecursion 10
MaxFiles 1000
StreamMaxLength 25M

# Analiza dentro de comprimidos (.zip, etc.) y documentos
ScanArchive true
ScanPDF true
ScanOLE2 true
ScanHTML true
