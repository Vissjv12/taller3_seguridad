# Firma DKIM de todo lo que envían usuarios AUTENTICADOS (puerto 587)
enabled = true;
sign_authenticated = true;
sign_local = false;

# El dominio de firma sale del From: visible, y debe coincidir con el usuario
use_domain = "header";
allow_username_mismatch = false;
allow_hdrfrom_mismatch = false;

# Selector activo: lo escribe el arranque del contenedor a partir de
# dkim-publica/activo (taller3-1, taller3-2... ver scripts/rotar-dkim.sh)
selector_map = "/var/lib/rspamd/dkim/selectores.map";
# Clave: /var/lib/rspamd/dkim/lab.test.<selector>.key
path = "/var/lib/rspamd/dkim/$domain.$selector.key";
