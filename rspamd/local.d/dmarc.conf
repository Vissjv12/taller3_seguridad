# Aplicar la política DMARC publicada por el dominio del From:.
# Sin este bloque Rspamd solo suma puntos; con él, p=reject rechaza en la sesión SMTP.
actions {
  quarantine = "add_header";
  reject = "reject";
}

# Sin salida a Internet no hay a quién enviar reportes
reporting {
  enabled = false;
}
