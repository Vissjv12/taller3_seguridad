# =====================================================================
#  OPCIONAL: análisis antivirus con ClamAV. Solo se activa si el archivo
#  .env tiene COMPOSE_PROFILES=antivirus (lo copia el arranque de Rspamd).
#  Límite: las firmas quedan "congeladas" en la fecha en que se construyó
#  la imagen, porque el laboratorio no tiene salida a Internet.
# =====================================================================
clamav {
  type = "clamav";
  servers = "172.30.53.12:3310";
  # Analiza los adjuntos y partes MIME, no solo el mensaje completo
  scan_mime_parts = true;
  scan_text_mime = false;
  scan_image_mime = false;
  symbol = "CLAM_VIRUS";
  # Virus detectado -> rechazo en la sesión SMTP
  action = "reject";
  message = 'Virus detectado por ${SCANNER}: ${VIRUS}';
  # Sin respuesta del antivirus: se marca CLAM_VIRUS_FAIL y el correo pasa
  timeout = 15.0;
  retransmits = 1;
}
