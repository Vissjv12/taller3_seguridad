# =====================================================================
#  Taller 3 - Dovecot (Debian 12: Dovecot 2.3.19)
#  ¡OJO! Sintaxis de la rama 2.3. Dovecot 2.4 (Debian 13) usa otros
#  nombres (ssl_server_cert_file, auth_allow_cleartext, etc.).
#  Documentación 2.3: https://doc.dovecot.org/2.3/
# =====================================================================

protocols = imap lmtp
listen = *

# Logs a la salida del contenedor
log_path = /dev/stderr
auth_verbose = yes
# auth_debug = yes        # descomentar solo para depurar

# --- Autenticación
# Prohíbe autenticación en claro: sin TLS no hay login (actividad 4)
disable_plaintext_auth = yes
auth_mechanisms = plain login
# Retraso tras un fallo de contraseña (frena fuerza bruta)
auth_failure_delay = 2 secs

# Agotamiento de recursos: conexiones IMAP simultáneas por usuario e IP
mail_max_userip_connections = 10

passdb {
  driver = passwd-file
  args = scheme=SHA512-CRYPT username_format=%u /etc/dovecot/users
}
userdb {
  driver = static
  args = uid=vmail gid=vmail home=/var/mail/vhosts/%d/%n
}
first_valid_uid = 5000

# --- TLS
ssl = required
ssl_cert = </etc/ssl/lab/mail.crt
ssl_key  = </etc/ssl/lab/private/mail.key
ssl_dh   = </usr/share/dovecot/dh.pem
ssl_min_protocol = TLSv1.2
ssl_prefer_server_ciphers = yes

# --- Almacenamiento (Maildir: un archivo por mensaje, fácil de inspeccionar)
mail_location = maildir:~/Maildir

namespace inbox {
  inbox = yes
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
}

# --- Servicios
service imap-login {
  # Límite de conexiones de login abiertas a la vez (todas las IP)
  process_min_avail = 1
  client_limit = 200
  # IMAP sin cifrar (143) DESHABILITADO
  inet_listener imap {
    port = 0
  }
  # IMAP con TLS implícito (993)
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

# Entrega desde Postfix
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}
protocol lmtp {
  postmaster_address = postmaster@lab.test
}

# Socket SASL para que Postfix autentique contra Dovecot
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}
