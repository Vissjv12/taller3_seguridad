// =====================================================================
//  Taller 3 - bind9 (Debian 12: BIND 9.18)
//  DNS autoritativo SOLO para lab.test y SOLO para la red del laboratorio.
//  Lo consulta Rspamd para leer SPF, DKIM y DMARC (registros TXT).
//  Los clientes (Thunderbird) siguen usando /etc/hosts.
// =====================================================================

include "/etc/bind/rndc.key";

controls {
  // rndc solo desde dentro del contenedor (lo usa lab-dmarc)
  inet 127.0.0.1 port 953 allow { 127.0.0.1; } keys { "rndc-key"; };
};

options {
  directory "/var/cache/bind";
  listen-on { any; };
  listen-on-v6 { none; };

  // Solo responde a la red del laboratorio
  allow-query { 127.0.0.1; 172.30.53.0/24; };

  // Autoritativo puro: no resuelve dominios ajenos (no hay salida a Internet).
  // Las consultas por otros dominios reciben REFUSED de inmediato.
  recursion no;
  allow-recursion { none; };
  dnssec-validation no;

  // No revelar la versión
  version "no disponible";
};

zone "lab.test" {
  type primary;
  file "/var/cache/bind/db.lab.test";
  allow-transfer { none; };
};
